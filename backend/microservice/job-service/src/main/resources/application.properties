# Service
spring.application.name=job
server.port=8082

# eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Exposer les endpoints health, info et metrics (seul health l'est par defaut)
management.endpoints.web.exposure.include=health,info,metrics,loggers

# Afficher le detail des composants dans /health (db, diskSpace, ping...)
management.endpoint.health.show-details=always

# Transmettre a Eureka le statut de /health (Job passe DOWN si la base tombe)
eureka.client.healthcheck.enabled=true

# Publier les proprietes info.* dans /actuator/info (desactive par defaut)
management.info.env.enabled=true

# Contenu affiche par /actuator/info
info.app.name=Job
info.app.version=1.0.0
info.app.description=Microservice de gestion des offres
info.app.team=yassine gharbi, bachir habboubi, chadha dalhoumi, dhia trabelssi

# Configuration DataSource MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/awd_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

